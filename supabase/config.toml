# Конфигурация Supabase CLI (локальная разработка и деплой функций).
project_id = "pickup"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "https://fantasysport-nu.vercel.app"
additional_redirect_urls = [
  "https://fantasysport-nu.vercel.app/auth/callback",
  "https://fantasysport-nu.vercel.app/auth/confirm",
  "https://fantasysport-*.vercel.app/**",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Авторизация проверяется внутри функции: x-cron-secret или JWT администратора.
[functions.sports-sync]
verify_jwt = false

# Публичная функция только для чтения: live-снимок матча.
[functions.live-match]
verify_jwt = false
